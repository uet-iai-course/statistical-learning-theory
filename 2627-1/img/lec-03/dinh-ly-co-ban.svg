<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="620" height="370" viewBox="0 0 620 370" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Các phép kéo theo của định lý cơ bản</title>
<desc id="d">Sơ đồ sáu khẳng định nối bằng mũi tên. Chiều VC hữu hạn (6) kéo theo hội tụ đều (1) theo Định lý 03.15; (1) kéo theo (2) mọi thuật toán ERM học PAC bất khả diễn; (2) kéo theo (3) học được PAC bất khả diễn và (5) mọi thuật toán ERM học PAC; (3) và (5) kéo theo (4) học được PAC; mũi tên đậm từ (4) về (6) là phần (a) của định lý.</desc>
