<title id="t">Đổi chỗ quan sát theo dấu ngẫu nhiên</title>
<desc id="d">Hai hàng bốn ô, tập huấn luyện S ở trên (Z1 đến Z4), mẫu bóng S′ ở dưới (Z′1 đến Z′4); trên các cột ghi dấu +1, −1, +1, −1. Ở cột hai và cột bốn, nơi dấu bằng âm một, hai quan sát đổi chỗ cho nhau; hai cột kia giữ nguyên. Sau khi đổi, hàng trên là Z1, Z′2, Z3, Z′4 và hàng dưới là Z′1, Z2, Z′3, Z4; các ô đã đổi có viền đứt.</desc>
