<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="600" height="345" viewBox="0 0 600 345" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Tám cách gán nhãn của ba điểm bởi nửa mặt phẳng</title>
<desc id="d">Tám ô nhỏ, mỗi ô ba điểm tại gốc, (1,0) và (0,1) với một cách gán nhãn ghi trên ô, theo thứ tự gốc, (1,0), (0,1). Điểm nhãn 1 tô đặc, nhãn 0 rỗng; phía nhãn 1 của nửa mặt phẳng tô gạch. Trong sáu ô có một đường thẳng tách điểm tô đặc khỏi điểm rỗng: đường dọc x bằng một nửa, đường ngang y bằng một nửa, hoặc đường x cộng y bằng một nửa. Ô 000 và ô 111 là hai hàm hằng, không có đường thẳng.</desc>
