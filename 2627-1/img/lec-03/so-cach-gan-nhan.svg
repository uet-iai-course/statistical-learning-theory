<title id="t">Ba cận cho số cách gán nhãn của một lớp có chiều VC 3</title>
<desc id="d">Đồ thị thang lôgarit theo số điểm m từ 1 đến 20, trục dọc từ 1 đến 10 mũ 7. Đường hai mũ m (nét liền, chấm tròn) tăng thẳng đến 1 048 576; tổng nhị thức với d bằng 3 (nét đứt, tam giác) tăng đến 1351; dạng đóng (em/3) mũ 3 (nét chấm, từ m bằng 3) tăng đến khoảng 5951 và nằm trên đường hai mũ m khi m từ 3 đến 9. Bốn ô vuông 2, 4, 8, 14 tại m từ 1 đến 4 là hàm tăng trưởng của lớp nửa mặt phẳng.</desc>
