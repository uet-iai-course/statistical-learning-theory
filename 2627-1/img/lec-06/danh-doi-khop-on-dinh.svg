<title id="t">Số hạng ổn định, số hạng khớp và tổng theo hệ số chính quy hóa</title>
<desc id="d">Đồ thị theo hệ số chính quy hóa trên trục lôgarit từ 0,02 đến 2, với G bằng 4, m bằng 1600 và chuẩn của điểm so sánh bằng 1. Số hạng ổn định (nét đứt) giảm từ 1 xuống 0,01, số hạng khớp (nét chấm) tăng từ 0,01 lên 1, và tổng (nét liền đậm) có dạng chữ U với đáy 0,2 tại hệ số 0,2. Ở hai đầu mút, tổng bằng 1,01.</desc>
