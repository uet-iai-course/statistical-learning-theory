<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="564" height="340" viewBox="0 0 564 340">
<title id="t">Hình 06.1. Hồi quy ridge khi thay một quan sát</title>
<desc id="d">Hai đồ thị của mục tiêu có chính quy hóa theo w trên đoạn từ −0,25 đến 1. Mỗi đồ thị có một đường liền cho tập huấn luyện S và một đường đứt cho tập huấn luyện thay quan sát thứ tư. Với λ = 0, hai điểm cực tiểu là 0,769 và 0,154, cách nhau 0,615. Với λ = 4, hai điểm cực tiểu là 0,222 và 0,044, cách nhau 0,178.</desc>
