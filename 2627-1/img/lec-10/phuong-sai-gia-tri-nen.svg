<title id="t">Phương sai của ước lượng gradient theo giá trị nền b</title>
<desc id="d">Bài toán bandit với xác suất chọn hành động 1 bằng 3/4, phần thưởng 3 và 1. Đường cong là phương sai của ước lượng gradient với giá trị nền hằng b, một parabol có giá trị nhỏ nhất 0 tại b = 3/2. Bốn điểm đánh dấu: b = 0 cho 27/64 (chấm tròn), b* = 3/2 cho 0 (ô vuông), b = J = 5/2 cho 3/16 (tam giác), b = 5 cho 147/64 (hình thoi).</desc>
