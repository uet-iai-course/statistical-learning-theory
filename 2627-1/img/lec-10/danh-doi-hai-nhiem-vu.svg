<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="400" height="380" viewBox="0 0 400 380" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Rủi ro nhiệm vụ mới theo rủi ro nhiệm vụ cũ</title>
<desc id="d">Đường cong (L_A(w), L_B(w)) = (w²/2, (w−1)²/2) khi tham số w chạy từ 0 đến 1, đi từ điểm (0; 0,5) tới điểm (0,5; 0). Năm chấm tròn trên đường cong ứng với hệ số chính quy hóa λ = 0, 1/3, 1, 3, 9; tăng λ làm rủi ro nhiệm vụ cũ L_A giảm và rủi ro nhiệm vụ mới L_B tăng. Đường thẳng nét đứt L_A + L_B = 1/4 chạm đường cong tại điểm λ = 1, nơi hai rủi ro cùng bằng 1/8; mọi điểm khác của đường cong nằm phía trên đường thẳng này.</desc>
