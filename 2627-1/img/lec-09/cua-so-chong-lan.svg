<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="800" height="272" viewBox="0 0 800 272" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Hai cửa sổ chồng lấn liền nhau</title>
<desc id="d">Một dãy mười hai giá trị liên tiếp của chuỗi, từ vị trí j−10 đến j+1. Cửa sổ kiểm tra u_j gồm mười giá trị ngữ cảnh j−10 đến j−1 (ngoặc trên, nét liền) và đích x_j. Cửa sổ huấn luyện u_{j+1} gồm mười giá trị ngữ cảnh j−9 đến j (ngoặc dưới, nét đứt) và đích x_{j+1}. Chín ô j−9 đến j−1 tô nền là chín giá trị chung của hai ngữ cảnh; ô j gạch chéo là đích của cửa sổ kiểm tra và đồng thời là giá trị cuối trong ngữ cảnh của cửa sổ huấn luyện.</desc>
<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#fff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#B15A2B" stroke-width="3"/></pattern></defs>
<rect width="800" height="272" fill="#fff"/>
