<text x="550.0" y="128.0" font-size="18" text-anchor="middle" fill="#222" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">j−2</text>
<rect x="580" y="92" width="60" height="58" fill="#F7EFE6" stroke="#8a8f98" stroke-width="1.5"/>
<text x="610.0" y="128.0" font-size="18" text-anchor="middle" fill="#222" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">j−1</text>
<rect x="640" y="92" width="60" height="58" fill="url(#hatch)" stroke="#8a8f98" stroke-width="1.5"/>
<text x="670.0" y="128.0" font-size="18" text-anchor="middle" fill="#222" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">j</text>
