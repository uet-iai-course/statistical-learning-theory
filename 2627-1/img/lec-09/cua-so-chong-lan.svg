<text x="310.0" y="128.0" font-size="18" text-anchor="middle" fill="#222" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">j−6</text>
<rect x="340" y="92" width="60" height="58" fill="#F7EFE6" stroke="#8a8f98" stroke-width="1.5"/>
<text x="370.0" y="128.0" font-size="18" text-anchor="middle" fill="#222" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">j−5</text>
<rect x="400" y="92" width="60" height="58" fill="#F7EFE6" stroke="#8a8f98" stroke-width="1.5"/>
<text x="430.0" y="128.0" font-size="18" text-anchor="middle" fill="#222" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">j−4</text>
<rect x="460" y="92" width="60" height="58" fill="#F7EFE6" stroke="#8a8f98" stroke-width="1.5"/>
<text x="490.0" y="128.0" font-size="18" text-anchor="middle" fill="#222" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">j−3</text>
