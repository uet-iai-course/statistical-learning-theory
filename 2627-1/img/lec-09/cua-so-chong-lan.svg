<text x="76.0" y="250.0" font-size="20" text-anchor="start" fill="#222" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">9 giá trị chung</text>
<rect x="290" y="232" width="26" height="22" fill="url(#hatch)" stroke="#8a8f98"/>
<text x="326.0" y="250.0" font-size="20" text-anchor="start" fill="#222" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke">x<tspan baseline-shift="sub" font-size="15">j</tspan>: đích của u<tspan baseline-shift="sub" font-size="15">j</tspan>, cuối ngữ cảnh của u<tspan baseline-shift="sub" font-size="15">j+1</tspan></text>
