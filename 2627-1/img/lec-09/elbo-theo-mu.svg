<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2" width="660" height="440" viewBox="0 0 660 440" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t2">Cận dưới bằng chứng theo trung bình của phân bố biến phân</title>
<desc id="d2">Hai parabol úp của cận dưới bằng chứng theo trung bình μ của phân bố biến phân, μ từ −0,5 đến 2,5, với phương sai 1/2 (nét liền, chấm tròn đặc) và 1 (nét chấm, ô vuông rỗng), cùng đỉnh tại μ = 1. Đường ngang nét đứt là log bằng chứng −2,2655. Parabol phương sai 1/2 chạm đường ngang tại μ = 1, nơi phân bố biến phân bằng hậu nghiệm; parabol phương sai 1 thấp hơn nó 0,1534 tại mọi μ. Bốn điểm của bảng: (0; −3,4189), (1; −2,4189), (0,8; −2,3055), (1; −2,2655). Mũi tên tại μ = 0 ghi khe 1,1534.</desc>
