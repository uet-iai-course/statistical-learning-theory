<text x="362.1" y="406.7" font-size="26" text-anchor="end" fill="#222" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke" >π</text>
<text x="440.6" y="248.9" font-size="26" text-anchor="start" fill="#B15A2B" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke" >u</text>
<text x="440.6" y="351.0" font-size="22" text-anchor="start" fill="#2F3E7A" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke" >1</text>
<text x="386.4" y="315.7" font-size="22" text-anchor="end" fill="#B15A2B" font-weight="normal" stroke="#fff" stroke-width="4" paint-order="stroke" >0,7654</text>
</svg>
