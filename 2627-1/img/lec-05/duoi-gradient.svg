<title id="t">Dưới gradient của hàm lồi và hàm không lồi</title>
<desc id="d">Hai đồ thị. Bên trái là hàm trị tuyệt đối, hình chữ V; bốn đường thẳng qua gốc với hệ số góc âm 1, âm 0,5, 0,5 và 1 đều nằm dưới hoặc chạm chữ V. Bên phải là hàm (w bình phương trừ 1) bình phương, có hai đáy tại âm 1 và 1 với giá trị 0 và một điểm tại 0 với giá trị 1, nơi đạo hàm bằng 0; đường nằm ngang qua điểm này cắt đồ thị, phần đồ thị nằm dưới đường được tô đậm.</desc>
