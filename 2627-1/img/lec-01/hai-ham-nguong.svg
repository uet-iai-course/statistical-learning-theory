<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="600" height="330" viewBox="0 0 600 330" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Hai hàm ngưỡng cùng khớp tập huấn luyện Sf</title>
<desc id="d">Năm mức đo từ 1 đến 5, mỗi mức 20% dân số; nhãn thật là 0 tại mức 1, 2 và 1 tại mức 3, 4, 5. Tập huấn luyện có nhãn 0 tại mức 1 và 2 (ô vuông rỗng), nhãn 1 tại mức 4 và 5 (chấm tròn đặc), không có quan sát ở mức 3. Hàm h3 báo 1 từ mức 3, hàm h4 báo 1 từ mức 4; hai hàm chỉ khác nhau ở cột mức 3 (gạch chéo), nơi h4 báo 0 trong khi nhãn thật là 1.</desc>
<rect width="600" height="330" fill="#fff"/>
<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#B15A2B" stroke-width="3"/></pattern></defs>
<rect x="364" y="58" width="72" height="232" fill="url(#hatch)" opacity="0.35"/>
<text x="14.0" y="41.0" font-size="20" text-anchor="start" fill="#222" font-weight="bold" >mức x</text>
<text x="230.0" y="41.0" font-size="20" text-anchor="middle" fill="#222" font-weight="bold" >1</text>
<text x="315.0" y="41.0" font-size="20" text-anchor="middle" fill="#222" font-weight="bold" >2</text>
<text x="400.0" y="41.0" font-size="20" text-anchor="middle" fill="#222" font-weight="bold" >3</text>
<text x="485.0" y="41.0" font-size="20" text-anchor="middle" fill="#222" font-weight="bold" >4</text>
<text x="570.0" y="41.0" font-size="20" text-anchor="middle" fill="#222" font-weight="bold" >5</text>
<line x1="14.0" y1="56.0" x2="590.0" y2="56.0" stroke="#666" stroke-width="1"/>
<text x="14.0" y="99.0" font-size="20" text-anchor="start" fill="#222" font-weight="normal" >nhãn thật</text>
<text x="14.0" y="157.0" font-size="20" text-anchor="start" fill="#222" font-weight="normal" >tập huấn luyện</text>
<text x="14.0" y="215.0" font-size="20" text-anchor="start" fill="#222" font-weight="normal" >h₃(x)</text>
<text x="14.0" y="273.0" font-size="20" text-anchor="start" fill="#222" font-weight="normal" >h₄(x)</text>
<text x="230.0" y="99.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >0</text>
<text x="230.0" y="215.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >0</text>
<text x="230.0" y="273.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >0</text>
<text x="315.0" y="99.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >0</text>
<text x="315.0" y="215.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >0</text>
<text x="315.0" y="273.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >0</text>
<text x="400.0" y="99.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >1</text>
<text x="400.0" y="215.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >1</text>
<text x="400.0" y="273.0" font-size="20" text-anchor="middle" fill="#B15A2B" font-weight="bold" >0</text>
<text x="485.0" y="99.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >1</text>
<text x="485.0" y="215.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >1</text>
<text x="485.0" y="273.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >1</text>
<text x="570.0" y="99.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >1</text>
<text x="570.0" y="215.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >1</text>
<text x="570.0" y="273.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >1</text>
<rect x="219" y="139" width="22" height="22" fill="#fff" stroke="#2F3E7A" stroke-width="3"/>
<text x="254.0" y="157.0" font-size="18" text-anchor="start" fill="#666" font-weight="normal" >0</text>
<rect x="304" y="139" width="22" height="22" fill="#fff" stroke="#2F3E7A" stroke-width="3"/>
<text x="339.0" y="157.0" font-size="18" text-anchor="start" fill="#666" font-weight="normal" >0</text>
<circle cx="485" cy="150" r="11" fill="#2F3E7A"/>
<text x="509.0" y="157.0" font-size="18" text-anchor="start" fill="#666" font-weight="normal" >1</text>
<circle cx="570" cy="150" r="11" fill="#2F3E7A"/>
<text x="594.0" y="157.0" font-size="18" text-anchor="start" fill="#666" font-weight="normal" >1</text>
<rect x="370" y="132" width="60" height="36" fill="#fff" stroke="#666" stroke-width="2" stroke-dasharray="6 4"/>
<text x="400.0" y="156.0" font-size="18" text-anchor="middle" fill="#666" font-weight="normal" >trống</text>
<text x="400.0" y="312.0" font-size="20" text-anchor="middle" fill="#B15A2B" font-weight="bold" >h₄ sai</text>
</svg>
