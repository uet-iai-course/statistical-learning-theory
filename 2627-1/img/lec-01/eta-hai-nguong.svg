<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="600" height="345" viewBox="0 0 600 345" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Quy tắc Bayes với hai ngưỡng 1/2 và 1/5 dưới Dη</title>
<desc id="d">Năm cột xác suất có điều kiện η(x) của nhãn 1 tại mức 1 đến 5: 0, 1/4, 3/4, 2/5, 1, với hai đường ngang tại 1/2 (nét đứt) và 1/5 (nét chấm). Hàng dưới trục ghi dự đoán của quy tắc Bayes: với ngưỡng 1/2 là 0, 0, 1, 0, 1; với ngưỡng 1/5 của hàm lỗi có trọng số là 0, 1, 1, 1, 1, tức hàm ngưỡng h2.</desc>
<rect width="600" height="345" fill="#fff"/>
<defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#B15A2B" stroke-width="3"/></pattern></defs>
<line x1="150.0" y1="210.0" x2="590.0" y2="210.0" stroke="#222" stroke-width="1.5"/>
<line x1="150.0" y1="30.0" x2="150.0" y2="210.0" stroke="#222" stroke-width="1.5"/>
<text x="142.0" y="47.0" font-size="20" text-anchor="end" fill="#222" font-weight="normal" >1</text>
<text x="142.0" y="217.0" font-size="20" text-anchor="end" fill="#222" font-weight="normal" >0</text>
<text transform="translate(110,125.0) rotate(-90)" font-size="20" text-anchor="middle" fill="#222">η(x)</text>
<rect x="226" y="210.0" width="48" height="0.0" fill="#edf4ff" stroke="#2F3E7A" stroke-width="2"/>
<text x="250.0" y="236.0" font-size="20" text-anchor="middle" fill="#222" font-weight="bold" >1</text>
<rect x="302" y="167.5" width="48" height="42.5" fill="#edf4ff" stroke="#2F3E7A" stroke-width="2"/>
<text x="326.0" y="236.0" font-size="20" text-anchor="middle" fill="#222" font-weight="bold" >2</text>
<rect x="378" y="82.5" width="48" height="127.5" fill="url(#hatch)" stroke="#2F3E7A" stroke-width="2"/>
<text x="402.0" y="236.0" font-size="20" text-anchor="middle" fill="#222" font-weight="bold" >3</text>
<rect x="454" y="142.0" width="48" height="68.0" fill="#edf4ff" stroke="#2F3E7A" stroke-width="2"/>
<text x="478.0" y="236.0" font-size="20" text-anchor="middle" fill="#222" font-weight="bold" >4</text>
<rect x="530" y="40.0" width="48" height="170.0" fill="url(#hatch)" stroke="#2F3E7A" stroke-width="2"/>
<text x="554.0" y="236.0" font-size="20" text-anchor="middle" fill="#222" font-weight="bold" >5</text>
<text x="14.0" y="236.0" font-size="20" text-anchor="start" fill="#222" font-weight="bold" >mức x</text>
<line x1="150.0" y1="125.0" x2="590.0" y2="125.0" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/>
<text x="160.0" y="119.0" font-size="19" text-anchor="start" fill="#222" font-weight="normal" >1/2</text>
<text x="14.0" y="268.0" font-size="19" text-anchor="start" fill="#222" font-weight="normal" >η(x)</text>
<text x="250.0" y="268.0" font-size="19" text-anchor="middle" fill="#222" font-weight="normal" >0</text>
<text x="326.0" y="268.0" font-size="19" text-anchor="middle" fill="#222" font-weight="normal" >1/4</text>
<text x="402.0" y="268.0" font-size="19" text-anchor="middle" fill="#222" font-weight="normal" >3/4</text>
<text x="478.0" y="268.0" font-size="19" text-anchor="middle" fill="#222" font-weight="normal" >2/5</text>
<text x="554.0" y="268.0" font-size="19" text-anchor="middle" fill="#222" font-weight="normal" >1</text>
<line x1="150.0" y1="176.0" x2="590.0" y2="176.0" stroke="#B15A2B" stroke-width="2.5" stroke-dasharray="2 4"/>
<text x="160.0" y="170.0" font-size="19" text-anchor="start" fill="#B15A2B" font-weight="normal" >1/5</text>
<text x="14.0" y="300.0" font-size="19" text-anchor="start" fill="#222" font-weight="normal" >báo, ngưỡng 1/2</text>
<text x="250.0" y="300.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >0</text>
<text x="326.0" y="300.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >0</text>
<text x="402.0" y="300.0" font-size="20" text-anchor="middle" fill="#B15A2B" font-weight="bold" >1</text>
<text x="478.0" y="300.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >0</text>
<text x="554.0" y="300.0" font-size="20" text-anchor="middle" fill="#B15A2B" font-weight="bold" >1</text>
<text x="14.0" y="332.0" font-size="19" text-anchor="start" fill="#222" font-weight="normal" >báo, ngưỡng 1/5</text>
<text x="250.0" y="332.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >0</text>
<text x="326.0" y="332.0" font-size="20" text-anchor="middle" fill="#B15A2B" font-weight="bold" >1</text>
<text x="402.0" y="332.0" font-size="20" text-anchor="middle" fill="#B15A2B" font-weight="bold" >1</text>
<text x="478.0" y="332.0" font-size="20" text-anchor="middle" fill="#B15A2B" font-weight="bold" >1</text>
<text x="554.0" y="332.0" font-size="20" text-anchor="middle" fill="#B15A2B" font-weight="bold" >1</text>
</svg>
