<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="640" height="182" viewBox="0 0 640 182" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Vùng lỗi của A_max và khối C</title>
