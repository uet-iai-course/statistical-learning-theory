<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="600" height="345" viewBox="0 0 600 345" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Xác suất thất bại của A_max dưới Df</title>
<desc id="d">Xác suất thất bại của thuật toán chọn ngưỡng lớn nhất dưới phân bố tất định Df theo cỡ mẫu m từ 0 đến 20, trục dọc lôgarit từ 0,001 đến 1. Với ε = 0,1 xác suất là 0,8 mũ m (chấm tròn, nét liền), xuống không quá 0,05 từ m = 14. Với ε = 0,25 xác suất là 0,6 mũ m (tam giác, nét đứt), xuống không quá 0,05 từ m = 6 và dưới 0,001 từ m = 14. Đường chấm ngang là δ = 0,05.</desc>
