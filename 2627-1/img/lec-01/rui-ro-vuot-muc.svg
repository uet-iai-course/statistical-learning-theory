<line x1="190.0" y1="96.0" x2="580.0" y2="96.0" stroke="#222" stroke-width="2"/>
<line x1="190.0" y1="96.0" x2="190.0" y2="102.0" stroke="#222" stroke-width="1.5"/>
<text x="190.0" y="124.0" font-size="18" text-anchor="middle" fill="#666" font-weight="normal" >0,15</text>
<line x1="287.5" y1="96.0" x2="287.5" y2="102.0" stroke="#222" stroke-width="1.5"/>
<text x="287.5" y="124.0" font-size="18" text-anchor="middle" fill="#666" font-weight="normal" >0,20</text>
<line x1="385.0" y1="96.0" x2="385.0" y2="102.0" stroke="#222" stroke-width="1.5"/>
<text x="385.0" y="124.0" font-size="18" text-anchor="middle" fill="#666" font-weight="normal" >0,25</text>
<line x1="482.5" y1="96.0" x2="482.5" y2="102.0" stroke="#222" stroke-width="1.5"/>
<text x="482.5" y="124.0" font-size="18" text-anchor="middle" fill="#666" font-weight="normal" >0,30</text>
<line x1="580.0" y1="96.0" x2="580.0" y2="102.0" stroke="#222" stroke-width="1.5"/>
<text x="580.0" y="124.0" font-size="18" text-anchor="middle" fill="#666" font-weight="normal" >0,35</text>
<circle cx="248.5" cy="96" r="7" fill="#2F3E7A"/>
<line x1="248.5" y1="88.0" x2="248.5" y2="56.0" stroke="#666" stroke-width="1"/>
<text x="248.5" y="48.0" font-size="19" text-anchor="end" fill="#222" font-weight="normal" >0,18: rủi ro Bayes</text>
<circle cx="326.5" cy="96" r="7" fill="#2F3E7A"/>
<line x1="326.5" y1="88.0" x2="326.5" y2="30.0" stroke="#666" stroke-width="1"/>
<text x="326.5" y="22.0" font-size="19" text-anchor="start" fill="#222" font-weight="normal" >0,22: tốt nhất trong lớp, h₃</text>
<circle cx="521.5" cy="96" r="7" fill="#2F3E7A"/>
<line x1="521.5" y1="88.0" x2="521.5" y2="56.0" stroke="#666" stroke-width="1"/>
<text x="521.5" y="48.0" font-size="19" text-anchor="middle" fill="#222" font-weight="normal" >0,32: h₂</text>
<path d="M248.5,138 L248.5,146 L326.5,146 L326.5,138" fill="none" stroke="#B15A2B" stroke-width="2.5"/>
<text x="287.5" y="170.0" font-size="19" text-anchor="middle" fill="#B15A2B" font-weight="normal" >0,04</text>
<path d="M326.5,138 L326.5,146 L521.5,146 L521.5,138" fill="none" stroke="#B15A2B" stroke-width="2.5"/>
<text x="424.0" y="170.0" font-size="19" text-anchor="middle" fill="#B15A2B" font-weight="normal" >0,10: do chọn h₂</text>
<text x="287.5" y="194.0" font-size="19" text-anchor="middle" fill="#B15A2B" font-weight="normal" >do lớp</text>
<path d="M248.5,208 L248.5,216 L521.5,216 L521.5,208" fill="none" stroke="#B15A2B" stroke-width="2.5"/>
<text x="385.0" y="240.0" font-size="19" text-anchor="middle" fill="#B15A2B" font-weight="normal" >0,14: so với rủi ro Bayes</text>
