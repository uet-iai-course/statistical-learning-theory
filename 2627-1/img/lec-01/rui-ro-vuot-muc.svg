<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="600" height="250" viewBox="0 0 600 250" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Phân rã rủi ro vượt mức của h2 dưới Dη</title>
<desc id="d">Trục rủi ro dưới Dη với hàm lỗi 0–1 từ 0,15 đến 0,35 có ba mốc: rủi ro Bayes 0,18, rủi ro nhỏ nhất trong lớp hàm ngưỡng 0,22 đạt tại h3, và rủi ro của h2 là 0,32. Rủi ro vượt mức của h2 so với rủi ro Bayes là 0,14, gồm 0,04 do lớp giả thuyết và 0,10 do chọn h2 thay cho h3.</desc>
