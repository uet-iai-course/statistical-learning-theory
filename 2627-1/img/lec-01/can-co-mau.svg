<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="600" height="440" viewBox="0 0 600 440" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Xác suất thất bại đúng dưới Df và cận cỡ mẫu chung</title>
<desc id="d">Ba đường theo cỡ mẫu m từ 0 đến 32 trên trục dọc lôgarit từ 0,001 đến 1, cắt ở mép dưới của trục. Nét liền: 0,8 mũ m, xác suất thất bại đúng dưới Df với ε = 0,1. Nét đứt: 0,6 mũ m, với ε = 0,25. Nét gạch chấm: e mũ trừ 0,1m, cận của Mệnh đề 01.31 cho mọi phân bố khả diễn với ε = 0,1. Ở cùng ε = 0,1, đường 0,8 mũ m xuống không quá mức δ = 0,05 tại m = 14, còn cận tại m = 30. Đường 0,6 mũ m (ε = 0,25) xuống không quá 0,05 tại m = 6.</desc>
