<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="600" height="340" viewBox="0 0 600 340" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Rủi ro thực nghiệm và rủi ro kì vọng của sáu hàm ngưỡng</title>
<desc id="d">Rủi ro thực nghiệm trên tập huấn luyện Sη cỡ 6 (chấm tròn, nét liền) và rủi ro kì vọng dưới Dη (ô vuông, nét đứt) của sáu hàm ngưỡng t = 1 đến 6. Rủi ro thực nghiệm: 1/2, 1/3, 1/3, 1/2, 1/3, 1/2. Rủi ro kì vọng: 0,52; 0,32; 0,22; 0,32; 0,28; 0,48. Ba ngưỡng 2, 3 và 5 cùng có rủi ro thực nghiệm 1/3; chỉ ngưỡng 3 đạt rủi ro kì vọng nhỏ nhất 0,22.</desc>
