<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="600" height="330" viewBox="0 0 600 330" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Hàm hằng 1 và hàm phân lớp ghi nhớ trên đoạn [0, 1]</title>
<desc id="d">Đoạn từ 0 đến 1 với tập huấn luyện m = 5 (tam giác trên trục) tại 0,12; 0,31; 0,47; 0,68; 0,90, mọi nhãn bằng 1. Hàng trên: hàm hằng 1 là đường liền ở mức 1, đúng ở mọi điểm, rủi ro 0. Hàng dưới: hàm phân lớp ghi nhớ là đường ở mức 0 với năm chấm đặc ở mức 1 tại năm điểm huấn luyện, sai tại mọi điểm khác, rủi ro 1.</desc>
