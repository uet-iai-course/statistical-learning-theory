<title id="t">Bán kính tin cậy một phía theo số ứng viên</title>
<desc id="d">Bán kính tin cậy một phía theo số ứng viên K trên thang lôgarit từ 1 đến 10 mũ 4, với cỡ mẫu 1000 và độ tin cậy 95%. Năm chấm tròn nối nét liền: 0,0387 khi K bằng 1; 0,0515 khi K bằng 10; 0,0616 khi K bằng 100; 0,0704 khi K bằng 1000; 0,0759 khi K bằng 5000.</desc>
