<title id="t">Phân bố của rủi ro thực nghiệm của h3 dưới D eta</title>
<desc id="d">Ba biểu đồ cột của hàm xác suất của rủi ro thực nghiệm k/m của ngưỡng 3 dưới phân bố có nhiễu, với cỡ mẫu 6, 100 và 200, cùng trục ngang từ 0 đến 1. Dải từ 0,12 đến 0,32 quanh 0,22 được tô nền và giới hạn bằng hai vạch đứt. Cột trong dải tô đặc; cột ngoài dải, kể cả cột nằm đúng trên vạch, gạch chéo ở cỡ mẫu 6 và tô màu khác ở cỡ mẫu 100, 200. Khối lượng ngoài dải là 0,6189 ở cỡ mẫu 6, 0,0211 ở cỡ mẫu 100 và 0,00089 ở cỡ mẫu 200.</desc>
