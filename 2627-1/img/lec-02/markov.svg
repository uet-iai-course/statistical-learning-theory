<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" width="520" height="400" viewBox="0 0 520 400" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
<title id="t">Bất đẳng thức từng điểm của bất đẳng thức Markov</title>
<desc id="d">Trên đoạn từ 0 đến 2α: đường chéo v (nét liền) và hàm bậc thang α nhân chỉ báo v lớn hơn hoặc bằng α (nét đứt), bằng 0 trước α và bằng α từ α trở đi, với chấm đặc tại (α, α) và chấm rỗng tại (α, 0). Hàm bậc thang luôn nằm dưới đường chéo; hai đường chạm nhau tại v bằng 0 và tại v bằng α; phần giữa hai đường được gạch chéo.</desc>
<rect width="520" height="400" fill="#fff"/>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#B15A2B" stroke-width="4"/></pattern></defs>
<polygon points="80.0,330.0 285.0,185.0 285.0,330.0" fill="url(#hatch)" opacity="0.35"/>
<polygon points="285.0,185.0 490.0,40.0 490.0,185.0" fill="url(#hatch)" opacity="0.35"/>
<line x1="80.0" y1="330.0" x2="490.0" y2="330.0" stroke="#222" stroke-width="1.5"/>
<line x1="80.0" y1="330.0" x2="80.0" y2="40.0" stroke="#222" stroke-width="1.5"/>
<line x1="80.0" y1="330.0" x2="80.0" y2="336.0" stroke="#222" stroke-width="1.5"/>
<text x="80.0" y="360.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >0</text>
<line x1="285.0" y1="330.0" x2="285.0" y2="336.0" stroke="#222" stroke-width="1.5"/>
<text x="285.0" y="360.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >α</text>
<line x1="74.0" y1="185.0" x2="80.0" y2="185.0" stroke="#222" stroke-width="1.5"/>
<text x="70.0" y="192.0" font-size="20" text-anchor="end" fill="#222" font-weight="normal" >α</text>
<line x1="490.0" y1="330.0" x2="490.0" y2="336.0" stroke="#222" stroke-width="1.5"/>
<text x="490.0" y="360.0" font-size="20" text-anchor="middle" fill="#222" font-weight="normal" >2α</text>
<line x1="74.0" y1="40.0" x2="80.0" y2="40.0" stroke="#222" stroke-width="1.5"/>
<text x="70.0" y="47.0" font-size="20" text-anchor="end" fill="#222" font-weight="normal" >2α</text>
<line x1="80.0" y1="330.0" x2="490.0" y2="40.0" stroke="#2F3E7A" stroke-width="3"/>
<text x="377.2" y="105.8" font-size="20" text-anchor="end" fill="#2F3E7A" font-weight="bold" >đường chéo</text>
<line x1="80.0" y1="328.5" x2="285.0" y2="328.5" stroke="#B15A2B" stroke-width="3.5" stroke-dasharray="9 5"/>
<line x1="285.0" y1="185.0" x2="490.0" y2="185.0" stroke="#B15A2B" stroke-width="3.5" stroke-dasharray="9 5"/>
<circle cx="285.0" cy="185.0" r="7" fill="#B15A2B"/>
<circle cx="285.0" cy="330.0" r="7" fill="#fff" stroke="#B15A2B" stroke-width="3"/>
<text x="490.0" y="215.0" font-size="20" text-anchor="end" fill="#B15A2B" font-weight="bold" >hàm bậc thang</text>
</svg>
