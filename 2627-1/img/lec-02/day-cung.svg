<title id="t">Dây cung của hàm mũ và cận của bổ đề Hoeffding</title>
<desc id="d">Đường cong e mũ 2w (nét liền) trên đoạn từ âm 0,22 đến 0,78, hai đầu mút đánh dấu ô vuông tại độ cao 0,644 và 4,759, cùng dây cung nét đứt nối hai đầu mút. Tại w bằng 0, đường cong có độ cao 1 (chấm rỗng), dây cung có độ cao 1,549 (chấm đặc), và vạch gạch chấm ngắn ở độ cao 1,649 là cận của bổ đề Hoeffding, cao hơn dây cung.</desc>
